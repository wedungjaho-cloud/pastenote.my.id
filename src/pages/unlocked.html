<div class="page-desktop" id="pageLayout">

  <!-- LEFT RAIL -->
  <div class="rail" id="railPane">
    <div class="resize-handle" id="resizeHandle"></div>
    <div class="rail-scroll">
      <div class="card fade-up">
        <div class="card-header">
          <div class="card-header-l">
            <div class="card-icon forest">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 4h8a2 2 0 0 1 2 2v13l-3.5-2-2.5 2-2.5-2L6 19V6a2 2 0 0 1 2-2Z"/>
                <path d="M9 9h6M9 12.5h4"/>
              </svg>
            </div>
            <h2>Notes</h2>
          </div>
          <button id="btnCopyNote" class="btn btn-g btn-sm" title="Copy note text" style="height:28px">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>
            <span>Copy</span>
          </button>
        </div>
        <div class="card-body">
          <div class="note-text" id="noteContentText">{{NOTE_CONTENT}}</div>
        </div>
      </div>

      {{INBOX_SECTION}}
    </div>
  </div>

  <!-- RIGHT DETAIL PANE (desktop only, populated by JS) -->
  <div class="detail-pane" id="detailPane">
    <div class="detail-empty" id="detailEmpty">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="opacity:.4">
        <path d="M3 8.5 12 14l9-5.5"/><rect x="3" y="5" width="18" height="14" rx="2.2"/>
      </svg>
      <p>Select a message to read</p>
    </div>
    <div class="detail-inner" id="detailInner" style="display:none"></div>
  </div>

</div>
<script>window.__PN_EMAIL__ = {{EMAIL_JSON}};</script>
