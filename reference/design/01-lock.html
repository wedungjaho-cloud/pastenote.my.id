<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pastenote — Locked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0b0c0e; --surface:#141519; --surface-2:#1b1d22; --surface-3:#22242a;
    --border:#262930; --border-strong:#34373f;
    --ink:#edeef1; --ink-dim:#c7c9cf; --muted:#8a8d96; --muted-2:#5f6169;
    --green:#3ecf8e; --green-strong:#2fb87d; --green-dim:rgba(62,207,142,.14); --green-glow:rgba(62,207,142,.25);
    --red:#e5625e; --red-dim:rgba(229,98,94,.12);
    --font-ui:'Inter',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-full:999px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-ui); background:var(--void); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; position:relative; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(ellipse 640px 420px at 50% 38%, rgba(62,207,142,.09), transparent 65%),
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size:100% 100%, 42px 42px, 42px 42px;
    opacity:1; mask-image:radial-gradient(ellipse 70% 60% at 50% 40%, #000 10%, transparent 75%);
    pointer-events:none;
  }
  .wrap{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:18px;}
  .card{
    width:376px; max-width:calc(100vw - 40px);
    background:linear-gradient(180deg, var(--surface), var(--surface) 60%, #121317);
    border:1px solid var(--border); border-radius:var(--r-xl);
    padding:38px 32px 30px;
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 20px 50px -20px rgba(0,0,0,.7);
    animation:rise .5s var(--ease) both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:none;} }

  .seal{
    width:56px; height:56px; border-radius:15px; margin:0 auto 22px;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 25%, var(--surface-3), var(--surface-2));
    border:1px solid var(--border-strong);
    box-shadow:0 0 0 1px rgba(62,207,142,.12), 0 0 26px -4px var(--green-glow);
    position:relative;
  }
  .seal svg{width:22px; height:22px; color:var(--green); stroke-width:1.7;}
  .seal::after{
    content:''; position:absolute; inset:-1px; border-radius:inherit;
    box-shadow:0 0 0 1px rgba(62,207,142,.22);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.4; transform:scale(1);} 50%{opacity:1; transform:scale(1.04);} }
  @media (prefers-reduced-motion: reduce){ .seal::after{animation:none;} }

  h1{ text-align:center; font-size:19px; font-weight:700; letter-spacing:-.01em; }
  .sub{
    text-align:center; margin-top:8px; margin-bottom:26px;
    font-family:var(--font-mono); font-size:12.5px; color:var(--muted);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .sub svg{width:13px; height:13px; opacity:.8;}

  form{display:flex; flex-direction:column; gap:12px;}
  .field{ position:relative; }
  .field input{
    width:100%; height:48px; padding:0 44px 0 16px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:var(--r-md); color:var(--ink);
    font-family:var(--font-mono); font-size:15px; letter-spacing:3px;
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
  }
  .field input::placeholder{ letter-spacing:normal; color:var(--muted-2); font-family:var(--font-ui); font-size:13.5px;}
  .field input:focus{
    outline:none; border-color:var(--green); background:var(--surface-3);
    box-shadow:0 0 0 4px var(--green-dim);
  }
  .eye{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--muted); cursor:pointer;
    border-radius:var(--r-sm); transition:color .15s, background .15s;
  }
  .eye:hover{ color:var(--ink-dim); background:var(--surface-3); }
  .eye svg{width:17px; height:17px;}

  button.unlock{
    margin-top:6px; height:48px; border:none; border-radius:var(--r-md);
    background:linear-gradient(180deg, var(--green), var(--green-strong));
    color:#08130e; font-family:var(--font-ui); font-weight:700; font-size:14.5px;
    letter-spacing:.01em; cursor:pointer; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s var(--ease), filter .15s;
  }
  button.unlock:hover{ filter:brightness(1.07); }
  button.unlock:active{ transform:scale(.98); }
  button.unlock:focus-visible{ outline:2px solid var(--green); outline-offset:3px; }
  button.unlock .spinner{
    width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(8,19,14,.3); border-top-color:#08130e;
    animation:spin .7s linear infinite; display:none;
  }
  button.unlock.loading .label{ opacity:0; }
  button.unlock.loading .spinner{ display:block; position:absolute; }
  button.unlock.success{ background:linear-gradient(180deg, var(--green), var(--green-strong)); }
  @keyframes spin{ to{transform:rotate(360deg);} }

  .err{
    font-size:12px; color:var(--red); display:none; align-items:center; gap:6px;
    padding-left:2px;
  }
  .err.show{ display:flex; animation:shake .32s var(--ease); }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }

  .foot{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em;
    color:var(--muted-2); text-align:center; text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="seal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.4"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/><circle cx="12" cy="15.2" r="1.15" fill="currentColor" stroke="none"/></svg>
      </div>
      <h1>Page Locked</h1>
      <div class="sub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11Z"/><path d="m3.5 6 8.5 6.5L20.5 6"/></svg>
        raynardportio50055@outlook.com
      </div>
      <form id="lockForm">
        <div class="field">
          <input id="pw" type="password" placeholder="Masukkan kunci akses" autocomplete="off" value="••••••••">
          <button type="button" class="eye" id="eyeBtn" aria-label="Tampilkan kunci">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="err" id="errMsg">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
          Kunci tidak cocok, coba lagi.
        </div>
        <button type="submit" class="unlock" id="unlockBtn">
          <span class="label">Unlock</span>
          <span class="spinner"></span>
        </button>
      </form>
    </div>
    <div class="foot">Akses privat &middot; khusus pemegang tautan</div>
  </div>

<script>
  const eyeBtn = document.getElementById('eyeBtn');
  const pw = document.getElementById('pw');
  eyeBtn.addEventListener('click', () => {
    pw.type = pw.type === 'password' ? 'text' : 'password';
  });

  const form = document.getElementById('lockForm');
  const btn = document.getElementById('unlockBtn');
  const err = document.getElementById('errMsg');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    err.classList.remove('show');
    btn.classList.add('loading');
    btn.disabled = true;
    setTimeout(() => {
      btn.classList.remove('loading');
      btn.querySelector('.label').textContent = 'Terbuka ✓';
      btn.classList.add('success');
      document.querySelector('.card').style.transition = 'opacity .4s ease, transform .4s ease';
      setTimeout(() => {
        document.querySelector('.wrap').style.opacity = '0';
        document.querySelector('.wrap').style.transform = 'scale(.98)';
      }, 500);
    }, 900);
  });
</script>
</body>
</html>
