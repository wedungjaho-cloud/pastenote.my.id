<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Tools</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#353534",
                        "tertiary-container": "#57f1db",
                        "background": "#131313",
                        "secondary": "#c8c6c5",
                        "outline-variant": "#3e4a40",
                        "tertiary-fixed-dim": "#3cddc7",
                        "on-tertiary": "#003731",
                        "secondary-fixed": "#e5e2e1",
                        "surface-container-highest": "#353534",
                        "on-surface": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "error": "#ffb4ab",
                        "on-tertiary-container": "#006b60",
                        "secondary-container": "#474746",
                        "on-secondary": "#313030",
                        "tertiary-fixed": "#62fae3",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#474746",
                        "on-primary-fixed-variant": "#00522d",
                        "on-background": "#e5e2e1",
                        "surface-container-lowest": "#0e0e0e",
                        "surface": "#131313",
                        "primary-container": "#86efac",
                        "on-primary": "#00391d",
                        "tertiary": "#d6fff6",
                        "inverse-surface": "#e5e2e1",
                        "error-container": "#93000a",
                        "on-tertiary-fixed": "#00201c",
                        "on-tertiary-fixed-variant": "#005047",
                        "primary-fixed-dim": "#73db9a",
                        "on-primary-container": "#006d3e",
                        "on-surface-variant": "#bdcabe",
                        "on-secondary-container": "#b7b5b4",
                        "outline": "#889489",
                        "inverse-primary": "#006d3e",
                        "on-secondary-fixed": "#1c1b1b",
                        "primary-fixed": "#8ff8b4",
                        "surface-container-high": "#2a2a2a",
                        "surface-container": "#201f1f",
                        "surface-dim": "#131313",
                        "on-primary-fixed": "#00210f",
                        "primary": "#dbffe2",
                        "secondary-fixed-dim": "#c8c6c5",
                        "surface-tint": "#73db9a",
                        "on-error": "#690005",
                        "surface-bright": "#3a3939",
                        "surface-container-low": "#1c1b1b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "container-max": "800px",
                        "section-gap": "64px"
                    },
                    "fontFamily": {
                        "display": ["Hanken Grotesk"],
                        "code-sm": ["JetBrains Mono"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "code-sm": ["13px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
        }
        
        .bg-mesh-texture {
            background-image: 
                radial-gradient(at 40% 20%, hsla(140, 70%, 50%, 0.05) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(160, 70%, 50%, 0.05) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(140, 70%, 50%, 0.05) 0px, transparent 50%),
                radial-gradient(at 80% 100%, hsla(160, 70%, 50%, 0.05) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(140, 70%, 50%, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: theme('colors.surface'); 
        }
        ::-webkit-scrollbar-thumb {
            background: theme('colors.surface-variant'); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: theme('colors.outline-variant'); 
        }
    </style>
</head>
<body class="bg-mesh-texture min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopNavBar -->
<nav class="bg-background/70 backdrop-blur-md dark:bg-background/70 docked full-width top-0 border-b border-white/5 border-b border-white/5 flat no shadows fixed top-0 w-full z-50 flex justify-between items-center px-gutter py-4 h-16">
<div class="flex items-center gap-4">
<span class="font-display text-xl font-bold text-on-surface dark:text-on-surface tracking-tight">pastenote</span>
<span class="font-label-caps text-label-caps bg-surface-container-high px-2 py-1 rounded text-primary-fixed-dim">ADMIN</span>
</div>
<div class="hidden md:flex items-center gap-8">
<a class="text-on-surface-variant dark:text-on-surface-variant font-body-md hover:text-on-surface hover:bg-white/5 transition-colors duration-200 px-3 py-1.5 rounded-md" href="#">Pages</a>
<a class="text-primary-container font-bold border-b-2 border-primary-container pb-1 px-3 py-1.5 bg-white/5 rounded-md scale-95 active:opacity-80 transition-all" href="#">Tools</a>
<a class="text-on-surface-variant dark:text-on-surface-variant font-body-md hover:text-on-surface hover:bg-white/5 transition-colors duration-200 px-3 py-1.5 rounded-md" href="#">Settings</a>
</div>
<div class="flex items-center gap-4">
<button aria-label="Toggle Theme" class="text-on-surface-variant hover:text-on-surface transition-colors p-2 rounded-md hover:bg-white/5 flex items-center justify-center scale-95 active:opacity-80 transition-all">
<span class="material-symbols-outlined text-[20px]" data-icon="wb_sunny">wb_sunny</span>
</button>
<button class="flex items-center gap-2 text-on-surface-variant hover:text-on-surface font-label-caps text-label-caps hover:bg-white/5 transition-colors duration-200 px-3 py-1.5 rounded-md scale-95 active:opacity-80 transition-all">
<span class="material-symbols-outlined text-[18px]" data-icon="logout">logout</span>
                Logout
            </button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[104px] pb-section-gap px-gutter max-w-container-max mx-auto w-full flex flex-col gap-section-gap">
<!-- Section 1: Check Live -->
<section class="bg-surface-container-low border border-white/5 rounded-xl overflow-hidden shadow-sm shadow-black/20">
<header class="border-b border-white/5 p-stack-md flex items-center gap-3 bg-surface/50">
<div class="w-8 h-8 rounded bg-surface-container-highest flex items-center justify-center border border-white/5">
<span class="material-symbols-outlined text-primary-container text-[18px]" data-icon="search">search</span>
</div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Check Live</h2>
</header>
<div class="p-gutter flex flex-col gap-stack-md bg-surface-container-low">
<div class="flex items-center gap-2">
<span class="text-on-surface-variant text-sm font-code-sm">Format:</span>
<span class="font-code-sm text-code-sm text-primary-container bg-surface-container px-2 py-1 rounded border border-white/5">email|password|refresh_token|client_id</span>
</div>
<textarea class="w-full bg-surface-container-lowest border border-white/5 focus:border-primary-container/50 focus:ring-1 focus:ring-primary-container/20 rounded-lg p-4 font-code-sm text-code-sm text-on-surface placeholder-on-surface-variant/50 min-h-[200px] resize-y transition-colors outline-none shadow-inner" placeholder="email|password|refresh_token|client_id
..."></textarea>
<div class="flex justify-between items-center pt-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">0 accounts</span>
<button class="bg-primary-container/10 border border-primary-container/30 text-primary-container hover:bg-primary-container/20 px-6 py-2 rounded font-label-caps text-label-caps transition-all flex items-center gap-2 shadow-[0_0_15px_rgba(134,239,172,0.1)] hover:shadow-[0_0_20px_rgba(134,239,172,0.2)]">
                        Check Live
                    </button>
</div>
</div>
</section>
<!-- Section 2: Auto Format -->
<section class="bg-surface-container-low border border-white/5 rounded-xl overflow-hidden shadow-sm shadow-black/20">
<header class="border-b border-white/5 p-stack-md flex items-center gap-3 bg-surface/50">
<div class="w-8 h-8 rounded bg-surface-container-highest flex items-center justify-center border border-white/5">
<span class="material-symbols-outlined text-primary-container text-[18px]" data-icon="content_copy">content_copy</span>
</div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Auto Format</h2>
</header>
<div class="p-gutter flex flex-col gap-stack-md bg-surface-container-low">
<div class="flex items-center gap-2 flex-wrap font-code-sm">
<span class="text-on-surface-variant text-sm">Format mixed accounts to</span>
<span class="font-code-sm text-code-sm text-primary-container bg-surface-container px-2 py-1 rounded border border-white/5">email|password</span>
<span class="text-on-surface-variant text-sm">. Remove duplicates. Client-side.</span>
</div>
<textarea class="w-full bg-surface-container-lowest border border-white/5 focus:border-primary-container/50 focus:ring-1 focus:ring-primary-container/20 rounded-lg p-4 font-code-sm text-code-sm text-on-surface placeholder-on-surface-variant/50 min-h-[160px] resize-y transition-colors outline-none shadow-inner" placeholder="Paste mixed accounts..."></textarea>
<div class="flex justify-end pt-2">
<button class="bg-surface-container-highest border border-white/10 text-on-surface hover:text-primary-container hover:border-primary-container/30 px-6 py-2 rounded font-label-caps text-label-caps transition-all">
                        Format
                    </button>
</div>
</div>
</section>
</main>
<!-- Footer -->
<footer class="bg-transparent border-t border-white/5 mt-section-gap flat no shadows max-w-container-max mx-auto px-gutter py-8 flex justify-between items-center w-full">
<span class="font-code-sm text-on-surface-variant opacity-70">pastenote · private note space</span>
<a class="text-on-surface-variant font-code-sm text-code-sm hover:text-primary-container opacity-70 hover:opacity-100 transition-colors" href="#">Admin-issued link</a>
</footer>
</body></html>
